<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      :root {
        --ground: #0d0e22;
        --ink: #f1eee4;
        --canario: #f4d35e;
        --rosa: #f29cb7;
        --menta: #8fd6b4;
        --celeste: #8db8f2;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Archivo", sans-serif; }
      #lines { position: absolute; inset: 0; }
      #lines svg { width: 1920px; height: 1080px; display: block; }
      .line { fill: none; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
      .train { fill: none; stroke: var(--ink); stroke-width: 10; stroke-linecap: round; }
      .station { fill: var(--ground); stroke: var(--ink); stroke-width: 11; }
      .word { position: absolute; right: 110px; bottom: 96px; height: 230px; overflow: hidden; }
      .word span {
        display: block; color: var(--ink); font-size: 196px; line-height: 230px; font-weight: 800;
        font-stretch: 125%; letter-spacing: -0.03em; white-space: nowrap; text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="lines" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <svg viewBox="0 0 1920 1080">
          <path id="l-data" class="line" stroke="#8fd6b4" d="M-40 560H1180" />
          <path id="l-infra" class="line" stroke="#8db8f2" d="M900 -40V760L1040 900H1180L1560 520" />
          <path id="l-backend" class="line" stroke="#f4d35e" d="M-40 130H470L900 560L1200 860H1420V-40" />
          <path id="l-mobile" class="line" stroke="#f29cb7" d="M-40 990H470L900 560L1220 240H1640L1800 400V700L1640 860H1420" />
          <path id="t-backend" class="train" d="M-40 130H470L900 560L1200 860H1420V-40" />
          <path id="t-mobile" class="train" d="M-40 990H470L900 560L1220 240H1640L1800 400V700L1640 860H1420" />
          <path id="t-data" class="train" d="M-40 560H1180" />
          <path id="t-infra" class="train" d="M900 -40V760L1040 900H1180L1560 520" />
          <g id="st-erp"><circle class="station" cx="900" cy="560" r="44" /></g>
          <g id="st-sap"><circle class="station" cx="420" cy="560" r="30" /></g>
          <g id="st-yah"><circle class="station" cx="1420" cy="240" r="30" /></g>
          <g id="st-mun"><circle class="station" cx="1420" cy="860" r="30" /></g>
        </svg>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const lines = ["#l-data", "#l-infra", "#l-backend", "#l-mobile"];
      lines.forEach((sel, i) => {
        const el = document.querySelector(sel);
        const len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len + " " + len });
        tl.fromTo(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.5, ease: "power3.inOut" }, 0.1 + i * 0.16);
        tl.fromTo(el, { strokeDashoffset: 0 }, { strokeDashoffset: -len, duration: 1.15, ease: "power2.inOut", immediateRender: false }, 6.5 + i * 0.07);
      });
      ["#st-sap", "#st-erp", "#st-yah", "#st-mun"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 1.15 + i * 0.12);
        tl.fromTo(sel, { scale: 1 }, { scale: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 6.45 + i * 0.05);
      });
      [["#t-backend", 1.9, 2.4], ["#t-mobile", 2.6, 2.8], ["#t-infra", 3.9, 2.0], ["#t-data", 4.3, 1.6]].forEach(([sel, at, dur]) => {
        const el = document.querySelector(sel);
        const len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: "90 " + (len + 200) });
        tl.fromTo(el, { strokeDashoffset: 90 }, { strokeDashoffset: -(len + 10), duration: dur, ease: "power1.inOut" }, at);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
